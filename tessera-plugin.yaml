id: desktop_launcher
version: "1.0.1"
api: "0.24"
icon: monitor
maintainer: Sephiat88
license: MIT
stage: beta
topics: [tech, home]
permissions:
  home_assistant_actions: [button.press, input_button.press, switch.toggle, input_boolean.toggle, script.turn_on]
tiles:
  - id: launcher
    name: tile
    sizes: {min: 1x1, max: 5x5}
    memory: 2048
    pictures: 1
    domains: [sensor, binary_sensor, button, input_button, switch, input_boolean, script]
    attributes: [unit_of_measurement]
    options:
      - id: target
        kind: entity
        label: target
        hint: target_hint
        domains: [button, input_button, switch, input_boolean, script]
      - id: icon_path
        kind: text
        label: icon_path
        hint: icon_hint
        default: ""
